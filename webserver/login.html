       function sendLogin(event) {
            event.preventDefault();

            var data = {
                type: "login",
                uname: document.getElementById("uname").value,
                password: document.getElementById("password").value
            };

            var request = new XMLHttpRequest();
            request.open("POST", "login.php", true);
            request.setRequestHeader("Content-Type", "application/json");

            request.onreadystatechange = function () {
                if (request.readyState === 4 && request.status === 200) {
                    try {
                        var res = JSON.parse(request.responseText);

                        if (res.status === "success") {
                            // Redirect to home page on successful login
                            window.location.href = "home.html";
                        } else {
                            // Display the error message from the database
                            document.getElementById("response").innerHTML = res.message || "Login failed";
                        }
                    } catch (e) {
                        document.getElementById("response").innerHTML = request.responseText;
                    }
                }
            };

            request.send(JSON.stringify(data));
        }
    </script>

<body>
    
    <h2>Login</h2>

    <form onsubmit="sendLogin(event)">
        <label>Username</label>
        <input type="text" id="uname" required><br><br>

        <label>Password</label>
        <input type="password" id="password"><br><br>

        <button type="submit">Submit</button>

    </form>
    <p id="response"></p>
    <p>Need to register? <a href="index.html">Click here</a></p>
</body>
