<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AuxTalks - Review Album</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="../home.html">Home</a>
        <a href="search.html">Search</a>
        <a href="collection.html">My Collection</a>
    </nav>

    <div class="container">
        <p><a id="backLink" href="#">&larr; Back to Album</a></p>
        <h2>Write a Review</h2>
        <h3 id="albumHeading"></h3>

        <form id="reviewForm">
            <label for="rating">Rating (1.0 to 5.0):</label><br>
            <select id="rating">
                <option value="5.0">5.0 ⭐⭐⭐⭐⭐</option>
                <option value="4.0" selected>4.0 ⭐⭐⭐⭐</option>
                <option value="3.0">3.0 ⭐⭐⭐</option>
                <option value="2.0">2.0 ⭐⭐</option>
                <option value="1.0">1.0 ⭐</option>
            </select><br>

            <label for="format">Format Reviewed:</label><br>
            <select id="format">
                <option value="Vinyl">Vinyl</option>
                <option value="CD">CD</option>
                <option value="Cassette">Cassette</option>
                <option value="Digital">Digital</option>
            </select><br>

            <label for="reviewText">Review Details:</label><br>
            <textarea id="reviewText" rows="6" placeholder="What did you think of the production, tracks, and packaging?" required></textarea><br>

            <button type="submit">Post Review</button>
            <button type="button" id="btnCancel">Cancel</button>
            <div id="status"></div>
        </form>

        <hr>
        <h3>Community Reviews</h3>
        <div id="reviewsList">Loading reviews...</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const releaseId = params.get('id');
        document.getElementById('albumHeading').innerText = params.get('title') || 'Album';
        document.getElementById('backLink').href = `album.html?id=${encodeURIComponent(releaseId || '')}`;

        document.getElementById('btnCancel').onclick = () => {
            window.location.href = `album.html?id=${encodeURIComponent(releaseId || '')}`;
        };

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // login.php lives one folder up from Features/
        function checkSession() {
            var request = new XMLHttpRequest();
            request.open("POST", "../login.php", true);
            request.setRequestHeader("Content-Type", "application/json");
            request.onreadystatechange = function () {
                if (request.readyState === 4 && request.status === 200) {
                    try {
                        var res = JSON.parse(request.responseText);
                        if (res.status !== "success") window.location.href = "../login.html";
                    } catch (e) { /* ignore bad response */ }
                }
            };
            request.send(JSON.stringify({ type: "validate_session" }));
        }
        window.onload = checkSession;

        function fetchReviews() {
            const container = document.getElementById('reviewsList');
            fetch(`album_actions.php?action=get_reviews&id=${encodeURIComponent(releaseId)}`)
                .then(r => r.json())
                .then(res => {
                    if (res.status === 'success' && Array.isArray(res.data) && res.data.length > 0) {
                        container.innerHTML = res.data.map(r => `
                            <div>
                                <strong>@${escapeHtml(r.user)}</strong> rated it <strong>${escapeHtml(r.rating)}/5.0</strong> (${escapeHtml(r.physical_format)})
                                <small>${escapeHtml(r.created_at)}</small>
                                <p>${r.review_text ? escapeHtml(r.review_text) : '<em>No review text provided.</em>'}</p>
                            </div>
                        `).join('');
                    } else {
                        container.innerHTML = '<p>No reviews yet for this album.</p>';
                    }
                })
                .catch(() => { container.innerHTML = '<p>Could not load reviews.</p>'; });
        }

        if (!releaseId) {
            document.getElementById('status').innerText = 'Error: No album ID provided.';
            document.getElementById('reviewsList').innerText = '';
        } else {
            fetchReviews();
        }

        document.getElementById('reviewForm').onsubmit = (e) => {
            e.preventDefault();
            const status = document.getElementById('status');
            const formData = new FormData();
            formData.append('action', 'add_review');
            formData.append('discogs_release_id', releaseId);
            formData.append('rating', document.getElementById('rating').value);
            formData.append('physical_format', document.getElementById('format').value);
            formData.append('review_text', document.getElementById('reviewText').value);

            fetch('album_actions.php', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(res => {
                    status.style.color = res.status === 'success' ? 'green' : 'red';
                    status.innerText = res.message || (res.status === 'success' ? 'Review posted!' : 'Could not post review.');
                    if (res.status === 'success') {
                        document.getElementById('reviewText').value = '';
                        fetchReviews();
                    }
                })
                .catch(() => {
                    status.style.color = 'red';
                    status.innerText = 'Could not post review (server error).';
                });
        };
    </script>
</body>
</html>
