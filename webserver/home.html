<!DOCTYPE html>
<html>
<head>
<title>AuxTalks Home</title>
<link rel="stylesheet" href="styles.css">
<script>
	function logout()
	{
		console.log("function successfully called");
		var request = new XMLHttpRequest();
		request.open("POST", "login.php", true);
		request.setRequestHeader("Content-Type", "application/json");

		request.onreadystatechange = function () 
		{
			if (request.readyState === 4)
			{
				window.location.href = "login.html";
			}
		};

		request.send(JSON.stringify({type: "logout"}));
	}
	
		function checkSession() {
			var request = new XMLHttpRequest();
			request.open("POST", "login.php", true);
			request.setRequestHeader("Content-Type", "application/json");

			request.onreadystatechange = function () {
				if (request.readyState === 4 && request.status === 200){
					var res = JSON.parse(request.responseText);

					if (res.status === "success") {
						document.getElementById("welcome").innerHTML = "welcome back, " + res.user;
					} else {
						window.location.href = "login.html";
					}
				}
			};
			
			request.send(JSON.stringify({type: "validate_session"}));
		}

		window.onload = checkSession;
</script>
</head>
<body>
	<button onclick="logout()">Logout</button>
	<h2 id="welcome">Loading session...</h2>
</body>
</html>
