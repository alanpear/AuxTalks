<!DOCTYPE html>
<html>

<head>
	<title>AuxTalks Home</title>
	<link rel="stylesheet" href="styles.css">

	<script>


		//Function used to log the user out
		function logout() {
			console.log("function successfully called");
			var request = new XMLHttpRequest();
			request.open("POST", "login.php", true);
			request.setRequestHeader("Content-Type", "application/json");

			request.onreadystatechange = function () {
				if (request.readyState === 4) {
					window.location.href = "login.html";
				}
			};

			request.send(JSON.stringify({ type: "logout" }));
		}

		//Checks if the user is logged in
		function checkSession() {
			var request = new XMLHttpRequest();
			request.open("POST", "login.php", true);
			request.setRequestHeader("Content-Type", "application/json");

			request.onreadystatechange = function () {
				//Success
				if (request.readyState === 4 && request.status === 200) {
					var res = JSON.parse(request.responseText);

					if (res.status === "success") {
						document.getElementById("welcome").innerHTML = "Welcome back, " + res.user;
					} 
					
					//Failed
					else {
						window.location.href = "login.html";
					}
				}
			};

			request.send(JSON.stringify({ type: "validate_session" }));
		}

		//Escapes text before putting it in the page
		function escapeHtml(value) {
			var div = document.createElement("div");
			div.textContent = value == null ? "" : String(value);
			return div.innerHTML;
		}

		//Gets one album suggestion based on the album the user most recently added to their collection
		function loadSuggestion() {
			var box = document.getElementById("suggestion");
			var request = new XMLHttpRequest();
			request.open("GET", "album_actions.php?action=get_suggestion", true);

			request.onreadystatechange = function () {
				if (request.readyState !== 4) return;

				var res;
				try {
					res = JSON.parse(request.responseText);
				} catch (e) {
					box.innerHTML = "<p>Unable to load a suggestion right now.</p>";
					return;
				}

				if (res.status !== "success") {
					box.innerHTML = "<p>" + escapeHtml(res.message || "Unable to load a suggestion right now.") + "</p>";
					return;
				}

				//No suggestion yet (empty collection or nothing similar found)
				var s = res.data;
				if (!s) {
					box.innerHTML = "<p>" + escapeHtml(res.message || "No suggestion yet.") + "</p>" +
						'<p><a href="search.html">Search for albums</a> and add them to your collection.</p>';
					return;
				}

				//Hierarchy: style, genre, year
				var reasons = [];
				if (s.shared_styles && s.shared_styles.length) reasons.push("Style: " + s.shared_styles.join(", "));
				if (s.shared_genres && s.shared_genres.length) reasons.push("Genre: " + s.shared_genres.join(", "));
				if (s.year_match) reasons.push("Released within 3 years of it (" + s.release_year + ")");

				var based = s.based_on || {};
				box.innerHTML =
					"<p>Because you added <a href=\"album.html?id=" + encodeURIComponent(based.discogs_release_id) + "\">" +
						escapeHtml(based.title) + "</a> by " + escapeHtml(based.artist) + ":</p>" +
					"<h4><a href=\"album.html?id=" + encodeURIComponent(s.discogs_release_id) + "\">" + escapeHtml(s.title) + "</a></h4>" +
					"<p>" + escapeHtml(s.artist) + (s.release_year ? " (" + escapeHtml(s.release_year) + ")" : "") + "</p>" +
					"<p>Shared with your album:</p>" +
					"<ul><li>" + reasons.map(escapeHtml).join("</li><li>") + "</li></ul>" +
					"<button type=\"button\" onclick=\"window.location.href='album.html?id=" + encodeURIComponent(s.discogs_release_id) + "'\">View Album</button>";
			};

			request.send();
		}
		window.onload = function () {
			checkSession();
			loadSuggestion();
		}
	</script>
</head>

<body>
	<a>Home</a>
	<button onclick="logout()">Logout</button>
	<h2 id="welcome">Loading session...</h2>
	<div>
		<a href="search.html">Search</a>
		<a href="profile.html">Profile</a>
		<a href="discussions.html">Discussions</a>

		<button type="button" onclick="window.location.href='search.html'">Search Music</button>
		<button type="button" onclick="window.location.href='profile.html'">My Profile</button>
		<button type="button" onclick="window.location.href='discussions.html'">Discussions</button>


	</div>
	<div>
		<h3>Suggested For You</h3>
		<div id="suggestion">Loading suggestion...</div>
	</div>
</body>

</html>
