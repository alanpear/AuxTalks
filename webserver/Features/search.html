<!DOCTYPE html>
<html>
<head>
    <title>AuxTalks - Search</title>
</head>
<body>

    <h1>Search Albums</h1>

    <form onsubmit="searchAlbum(event)">
        <input type="text" id="album" required>
        <button type="submit">Search</button>
    </form>

    <p id="message"></p>
    <div id="results"></div>

    <script>
        function searchAlbum(event) {
            event.preventDefault();

            var data = {
                query: document.getElementById("album").value
            };

            var request = new XMLHttpRequest();

            request.open("POST", "search.php", true);

            request.setRequestHeader(
                "Content-Type",
                "application/json"
            );

            request.onreadystatechange = function() {
                if (request.readyState === 4) {
                    var results = document.getElementById("results");
                    var message = document.getElementById("message");

                    results.replaceChildren();

                    if (request.status !== 200) {
                        message.textContent = "Search failed.";
                        return;
                    }

                    try {
                        var res = JSON.parse(request.responseText);

                        if (res.status !== "success") {
                            message.textContent = res.message || "Search failed.";
                            return;
                        }

                        message.textContent = "";

                        res.results.forEach(function(album) {
                            var div = document.createElement("div");

                            if (album.cover_image) {
                                var image = document.createElement("img");
                                image.src = album.cover_image;
                                image.alt = album.title;
                                image.width = 200;
                                div.appendChild(image);
                            }

                            var title = document.createElement("h3");
                            title.textContent = album.title;

                            div.appendChild(title);
                            results.appendChild(div);
                        });

                    } catch (error) {
                        message.textContent = "Invalid server response.";
                    }
                }
            };

            request.send(JSON.stringify(data));
        }
    </script>

</body>
</html>
