<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AuxTalks - Search</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .album-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }
        .album-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>Search Albums</h1>
    <p><a href="../home.html">&larr; Back to Dashboard</a></p>

    <form onsubmit="searchAlbum(event)">
        <input type="text" id="album" placeholder="Enter artist or album name" required>
        <button type="submit">Search</button>
    </form>

    <p id="message"></p>
    <div id="results"></div>

    <script>
        function searchAlbum(event) {
            event.preventDefault();

            var queryVal = document.getElementById("album").value.trim();
            if (!queryVal) return;

            var message = document.getElementById("message");
            var results = document.getElementById("results");

            message.textContent = "Searching...";
            results.replaceChildren();

            var data = { query: queryVal };
            var request = new XMLHttpRequest();

            request.open("POST", "search.php", true);
            request.setRequestHeader("Content-Type", "application/json");

            request.onreadystatechange = function() {
                if (request.readyState === 4) {
                    if (request.status !== 200) {
                        message.textContent = "Search failed (HTTP " + request.status + ").";
                        return;
                    }

                    try {
                        var res = JSON.parse(request.responseText);

                        if (res.status !== "success") {
                            message.textContent = res.message || "Search failed.";
                            return;
                        }

                        // Support both formats: res.results or res.data.results
                        var albums = res.results || (res.data && res.data.results) || [];

                        if (albums.length === 0) {
                            message.textContent = "No albums found.";
                            return;
                        }

                        message.textContent = "";

                        albums.forEach(function(album) {
                            var div = document.createElement("div");
                            div.className = "album-item";

                            if (album.cover_image) {
                                var image = document.createElement("img");
                                image.src = album.cover_image;
                                image.alt = album.title;
                                div.appendChild(image);
                            }

                            var infoDiv = document.createElement("div");
                            var title = document.createElement("h3");
                            title.textContent = album.title;
                            infoDiv.appendChild(title);

                            var meta = document.createElement("p");
                            meta.textContent = (album.year || album.release_year || "Unknown Year") + " • " + (album.format || album.format_summary || "Standard");
                            infoDiv.appendChild(meta);

                            div.appendChild(infoDiv);
                            results.appendChild(div);
                        });

                    } catch (error) {
                        console.error("Parse or render error:", error, request.responseText);
                        message.textContent = "Invalid server response.";
                    }
                }
            };

            request.send(JSON.stringify(data));
        }
    </script>

</body>
</html>
