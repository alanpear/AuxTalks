<html>

<head>
	<link rel="stylesheet" href="styles.css">
	<title>Register</title>
	<script>
		//function for when registration is submitted
		function sendRegister(event) {
			event.preventDefault();

			//create registration payload
			var data = {
				type: "register",
				first_name: document.getElementById("first_name").value,
				last_name: document.getElementById("last_name").value,
				email: document.getElementById("email").value,
				uname: document.getElementById("uname").value,
				password: document.getElementById("password").value
			};

			//create an xml request, do a post request, and set payload to json
			var request = new XMLHttpRequest();
			request.open("POST", "login.php", true);
			request.setRequestHeader("Content-Type", "application/json");

			//
			request.onreadystatechange = function () {
				if (request.readyState === 4 && request.status === 200) {
					var res = JSON.parse(request.responseText);
					if (res.message === "Registration completed!") {
						window.location.href = "home.html" // redirect to homepage
					} else {
						document.getElementId("response").innerHTML = res.message;
					}
				}
			};

			//data to json string and send post req
			request.send(JSON.stringify(data));
		};
	</script>
</head>

<body>
	<h2>Register</h2>

	<form onsubmit="sendRegister(event)">
		<label>First Name</label>
		<input type="text" id="first_name" required><br><br>

		<label>Last Name</label>
		<input type="text" id="last_name" required><br><br>

		<label>Email</label>
		<input type="text" id="email" required><br><br>

		<label>Username</label>
		<input type="text" id="uname" required><br><br>

		<label>Password</label>
		<input type="password" id="password"><br><br>

		<button type="submit">Submit</button>

	</form>
	<p id="response"></p>
</body>

<script>

	function HandleLoginResponse(response) {
		var text = JSON.parse(response);
		//	document.getElementById("textResponse").innerHTML = response+"<p>";	
		document.getElementById("textResponse").innerHTML = "response: " + text + "<p>";
	}

	function SendLoginRequest(username, password) {
		var request = new XMLHttpRequest();
		request.open("POST", "login.php", true);
		request.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
		request.onreadystatechange = function () {

			if ((this.readyState == 4) && (this.status == 200)) {
				HandleLoginResponse(this.responseText);
			}
		}
		request.send("type=login&uname=" + username + "&pword=" + password);
	}
</script>


<body>
	<div id="textResponse">
		awaiting response
	</div>
	<script>
		SendLoginRequest("kehoed", "12345");
	</script>
</body>

</html>
