<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AuxTalks - Marketplace</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .page { max-width: 1000px; margin: 0 auto; padding: 0 12px; }
        .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
        .toolbar input { width: 260px; margin: 0; }
        .toolbar select, .toolbar button { width: auto; padding: 8px 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
        .card {
            background: white; border: 1px solid #ccc; border-radius: 6px;
            padding: 12px; display: flex; flex-direction: column; gap: 4px;
            color: inherit; text-decoration: none;
        }
        .card:hover { border-color: #888; }
        .card .price { font-size: 1.4em; font-weight: bold; }
        .card .title { font-weight: bold; }
        .meta { color: #666; font-size: 0.9em; }
        .sell-form { width: auto; max-width: 600px; margin: 12px 0 20px; display: none; }
        .sell-form label { display: block; margin-top: 8px; font-weight: bold; }
        .sell-form select, .sell-form textarea { width: 100%; padding: 6px; box-sizing: border-box; margin-top: 4px; }
        .sell-form .row { display: flex; gap: 10px; }
        .sell-form .row > div { flex: 1; }
        .sell-form button { margin-top: 10px; }
        #toggleSell { width: auto; padding: 8px 16px; }
        .my-listing { background: white; border: 1px solid #ccc; border-radius: 4px; padding: 10px 14px; margin-bottom: 8px; }
        .my-listing .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
        .my-listing .actions input { width: 100px; margin: 0; }
        .my-listing .actions button { width: auto; padding: 4px 10px; }
        .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 0.8em; background: #eee; }
        .badge.active { background: #d8f0d8; }
        .badge.sold { background: #f0d8d8; }
    </style>
</head>

<body>
    <nav class="navbar">
        <a href="home.html">Home</a>
        <a href="search.html">Search</a>
        <a href="marketplace.html">Marketplace</a>
        <a href="watchlist.html">Watchlist</a>
        <a href="discussions.html">Discussions</a>
        <a href="profile.html">Profile</a>
    </nav>

    <div class="page">
        <h1>Marketplace</h1>
        <p class="meta">Buy and sell records with other AuxTalks members.</p>

        <button id="toggleSell">+ Sell an Album</button>

        <form id="sellForm" class="sell-form">
            <h3>Sell an Album</h3>
            <label for="sellAlbum">Album (from your collection):</label>
            <select id="sellAlbum" required>
                <option value="">Loading your collection...</option>
            </select>
            <p class="meta">Don't see it? <a href="search.html">Search for the album</a>, add it to your collection, then come back.</p>

            <label for="sellPrice">Price (USD):</label>
            <input type="number" id="sellPrice" min="0.01" step="0.01" required placeholder="e.g. 25.00">

            <div class="row">
                <div>
                    <label for="sellCondition">Media condition:</label>
                    <select id="sellCondition">
                        <option value="M">Mint</option>
                        <option value="NM">Near Mint</option>
                        <option value="VG+" selected>Very Good +</option>
                        <option value="VG">Very Good</option>
                        <option value="G+">Good +</option>
                        <option value="G">Good</option>
                        <option value="F">Fair</option>
                        <option value="P">Poor</option>
                    </select>
                </div>
                <div>
                    <label for="sellSleeve">Sleeve condition:</label>
                    <select id="sellSleeve">
                        <option value="M">Mint</option>
                        <option value="NM">Near Mint</option>
                        <option value="VG+" selected>Very Good +</option>
                        <option value="VG">Very Good</option>
                        <option value="G+">Good +</option>
                        <option value="G">Good</option>
                        <option value="F">Fair</option>
                        <option value="P">Poor</option>
                    </select>
                </div>
                <div>
                    <label for="sellFormat">Format:</label>
                    <select id="sellFormat">
                        <option value="Vinyl">Vinyl</option>
                        <option value="CD">CD</option>
                        <option value="Cassette">Cassette</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <label for="sellLocation">Location (optional):</label>
            <input type="text" id="sellLocation" maxlength="100" placeholder="e.g. Newark, NJ - local pickup or shipping">

            <label for="sellDescription">Description (optional):</label>
            <textarea id="sellDescription" rows="4" placeholder="Pressing details, flaws, shipping info..."></textarea>

            <button type="submit">Post Listing</button>
            <p id="sellStatus"></p>
        </form>

        <div class="toolbar">
            <input type="text" id="searchBox" placeholder="Search by album or artist">
            <select id="sortBox">
                <option value="newest">Newest first</option>
                <option value="price_asc">Price: low to high</option>
                <option value="price_desc">Price: high to low</option>
            </select>
            <button id="searchBtn">Search</button>
            <span id="albumFilter" class="meta"></span>
        </div>

        <div id="listings" class="grid">Loading listings...</div>

        <h2>My Listings</h2>
        <div id="myListings">Loading...</div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        let albumFilter = parseInt(params.get('album') || '0', 10) || 0; //marketplace.html?album=<id> shows one album
        const sellId = parseInt(params.get('sell') || '0', 10) || 0;   //marketplace.html?sell=<id> opens the sell form for an album
        const sellTitle = params.get('title') || '';

        const gradeNames = { 'M': 'Mint', 'NM': 'Near Mint', 'VG+': 'Very Good +', 'VG': 'Very Good', 'G+': 'Good +', 'G': 'Good', 'F': 'Fair', 'P': 'Poor' };

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }
        function money(v) { return '$' + Number(v).toFixed(2); }

        // ---------- browse listings ----------
        function loadListings() {
            const box = document.getElementById('listings');
            const search = document.getElementById('searchBox').value.trim();
            const sort = document.getElementById('sortBox').value;
            document.getElementById('albumFilter').innerHTML = albumFilter
                ? `Showing one album only. <a href="#" onclick="clearAlbumFilter(); return false;">Show all</a>` : '';

            box.innerText = 'Loading listings...';
            fetch(`marketplace_actions.php?action=get_listings&search=${encodeURIComponent(search)}&sort=${sort}&album=${albumFilter}`)
                .then(r => r.json())
                .then(res => {
                    if (res.status !== 'success') { box.innerText = res.message || 'Could not load listings.'; return; }
                    const items = res.data || [];
                    if (items.length === 0) { box.innerHTML = '<p>No albums for sale yet.</p>'; return; }
                    box.innerHTML = items.map(l => `
                        <a class="card" href="listing.html?id=${l.id}">
                            <span class="price">${money(l.price)}</span>
                            <span class="title">${escapeHtml(l.title)}</span>
                            <span>${escapeHtml(l.artist)}${l.release_year ? ' (' + escapeHtml(l.release_year) + ')' : ''}</span>
                            <span class="meta">${escapeHtml(l.physical_format)} &middot; ${escapeHtml(gradeNames[l.condition_grade] || l.condition_grade)}</span>
                            ${l.location ? `<span class="meta">${escapeHtml(l.location)}</span>` : ''}
                            <span class="meta">Sold by @${escapeHtml(l.user)}</span>
                        </a>`).join('');
                })
                .catch(() => { box.innerText = 'Could not load listings.'; });
        }

        function clearAlbumFilter() {
            albumFilter = 0;
            history.replaceState(null, '', 'marketplace.html');
            loadListings();
        }

        document.getElementById('searchBtn').onclick = loadListings;
        document.getElementById('sortBox').onchange = loadListings;
        document.getElementById('searchBox').onkeydown = (e) => { if (e.key === 'Enter') loadListings(); };

        // ---------- sell form ----------
        let collectionById = {};
        function loadCollectionOptions() {
            const select = document.getElementById('sellAlbum');
            fetch('album_actions.php?action=get_collection')
                .then(r => r.json())
                .then(res => {
                    const albums = res.status === 'success' ? (res.data || []) : [];
                    collectionById = {};
                    albums.forEach(a => { collectionById[a.discogs_release_id] = a; });
                    let options = '<option value="">-- Pick an album --</option>' + albums.map(a =>
                        `<option value="${a.discogs_release_id}">${escapeHtml(a.title)} - ${escapeHtml(a.artist)}</option>`).join('');
                    //came from an album page with ?sell= but it isn't in their collection yet
                    if (sellId && !collectionById[sellId]) {
                        options += `<option value="${sellId}">${escapeHtml(sellTitle || 'Album #' + sellId)}</option>`;
                    }
                    select.innerHTML = options;
                    if (sellId) { select.value = sellId; fillConditionFromCollection(); }
                })
                .catch(() => { select.innerHTML = '<option value="">Could not load your collection</option>'; });
        }

        //use the condition they saved in their collection as the starting point
        function fillConditionFromCollection() {
            const a = collectionById[document.getElementById('sellAlbum').value];
            if (!a) return;
            if (a.condition_grade) document.getElementById('sellCondition').value = a.condition_grade;
            if (a.sleeve_condition) document.getElementById('sellSleeve').value = a.sleeve_condition;
        }
        document.getElementById('sellAlbum').onchange = fillConditionFromCollection;

        document.getElementById('toggleSell').onclick = () => {
            const form = document.getElementById('sellForm');
            form.style.display = form.style.display === 'block' ? 'none' : 'block';
        };

        document.getElementById('sellForm').onsubmit = (e) => {
            e.preventDefault();
            const status = document.getElementById('sellStatus');
            const formData = new FormData();
            formData.append('action', 'create_listing');
            formData.append('discogs_release_id', document.getElementById('sellAlbum').value);
            formData.append('price', document.getElementById('sellPrice').value);
            formData.append('condition_grade', document.getElementById('sellCondition').value);
            formData.append('sleeve_condition', document.getElementById('sellSleeve').value);
            formData.append('physical_format', document.getElementById('sellFormat').value);
            formData.append('location', document.getElementById('sellLocation').value);
            formData.append('description', document.getElementById('sellDescription').value);

            status.style.color = '#666';
            status.innerText = 'Posting...';
            fetch('marketplace_actions.php', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(res => {
                    status.style.color = res.status === 'success' ? 'green' : 'red';
                    status.innerText = res.message || (res.status === 'success' ? 'Listed!' : 'Could not post listing.');
                    if (res.status === 'success') {
                        document.getElementById('sellForm').reset();
                        loadListings();
                        loadMyListings();
                    }
                })
                .catch(() => { status.style.color = 'red'; status.innerText = 'Could not post listing (server error).'; });
        };

        // ---------- my listings ----------
        function loadMyListings() {
            const box = document.getElementById('myListings');
            fetch('marketplace_actions.php?action=get_my_listings')
                .then(r => r.json())
                .then(res => {
                    const items = res.status === 'success' ? (res.data || []) : [];
                    if (res.status !== 'success') { box.innerText = res.message || 'Could not load your listings.'; return; }
                    if (items.length === 0) { box.innerHTML = '<p class="meta">You have no listings yet.</p>'; return; }
                    box.innerHTML = items.map(l => `
                        <div class="my-listing">
                            <a href="listing.html?id=${l.id}"><strong>${escapeHtml(l.title)}</strong></a> - ${escapeHtml(l.artist)}
                            <span class="badge ${escapeHtml(l.status)}">${escapeHtml(l.status)}</span>
                            <div class="meta">${money(l.price)} &middot; ${escapeHtml(l.physical_format)} &middot; ${escapeHtml(l.condition_grade)} / ${escapeHtml(l.sleeve_condition)} &middot; listed ${escapeHtml(l.created_at)}</div>
                            <div class="actions">
                                ${l.status === 'active' ? `
                                    <input type="number" min="0.01" step="0.01" id="newPrice-${l.id}" value="${Number(l.price).toFixed(2)}">
                                    <button onclick="updateListing(${l.id}, 'price')">Update Price</button>
                                    <button onclick="updateListing(${l.id}, 'sold')">Mark Sold</button>` : `
                                    <button onclick="updateListing(${l.id}, 'active')">Relist</button>`}
                                <button onclick="updateListing(${l.id}, 'removed')">Delete</button>
                            </div>
                        </div>`).join('');
                })
                .catch(() => { box.innerText = 'Could not load your listings.'; });
        }

        function updateListing(id, what) {
            if (what === 'removed' && !confirm('Delete this listing?')) return;
            const formData = new FormData();
            formData.append('action', 'update_listing');
            formData.append('listing_id', id);
            if (what === 'price') formData.append('price', document.getElementById('newPrice-' + id).value);
            else formData.append('status', what);
            fetch('marketplace_actions.php', { method: 'POST', body: formData })
                .then(r => r.json())
                .then(res => {
                    if (res.status !== 'success') alert(res.message || 'Could not update listing.');
                    loadListings();
                    loadMyListings();
                })
                .catch(() => alert('Could not update listing.'));
        }

        function checkSession() {
            var request = new XMLHttpRequest();
            request.open("POST", "login.php", true);
            request.setRequestHeader("Content-Type", "application/json");
            request.onreadystatechange = function () {
                if (request.readyState === 4 && request.status === 200) {
                    try {
                        var res = JSON.parse(request.responseText);
                        if (res.status !== "success") window.location.href = "login.html";
                    } catch (e) { /* ignore bad response */ }
                }
            };
            request.send(JSON.stringify({ type: "validate_session" }));
        }

        window.onload = () => {
            checkSession();
            loadListings();
            loadMyListings();
            loadCollectionOptions();
            if (sellId) document.getElementById('sellForm').style.display = 'block';
        };
    </script>
</body>
</html>
