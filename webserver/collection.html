<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AuxTalks - My Collection</title>
    <link rel="stylesheet" href="styles.css">
</head>
<script>
    function checkSession() {
		var request = new XMLHttpRequest();
		request.open("POST", "login.php", true);
		request.setRequestHeader("Content-Type", "application/json");

		request.onreadystatechange = function () {
			if (request.readyState === 4 && request.status === 200){
    			var res = JSON.parse(request.responseText);

				if (res.status === "success") {
					document.getElementById("welcome").innerHTML = "welcome back, " + res.user;
				} else {
					window.location.href = "login.html";
				}
			}
		};
			
		request.send(JSON.stringify({type: "validate_session"}));
	}

    window.onload = checkSession;
</script>
<body>
    <nav class="navbar">
        <a href="home.html">Home</a>
        <a href="search.html">Search</a>
        <a href="collection.html">My Collection</a>
        <a href="profile.html">Profile</a>
    </nav>

    <div class="container" >
        <h2>My Saved Collection</h2>
        <div id="loading">Loading collection...</div>
        <div id="collectionContainer" ></div>
    </div>

    <script>
        fetch('album_actions.php?action=get_collection')
            .then(r => r.json())
            .then(res => {
                document.getElementById('loading').style.display = 'none';
                const container = document.getElementById('collectionContainer');

                const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
                if (res.status === 'success' && res.data && res.data.length > 0) {
                    container.innerHTML = res.data.map(item => `
                        <div style="background:white;border:1px solid #ccc;padding:10px 14px;margin-bottom:10px;max-width:700px;">
                            <h3><a href="album.html?id=${encodeURIComponent(item.discogs_release_id)}">${esc(item.title)}</a></h3>
                            <p>${esc(item.artist)}${item.release_year ? ' (' + esc(item.release_year) + ')' : ''} | <em>${esc(item.format_summary)}</em></p>
                            ${Array.isArray(item.genres) && item.genres.length ? `<p>Genres: ${esc(item.genres.join(', '))}</p>` : ''}
                            <small style="color: #888;">Media: ${esc(item.condition_grade)} | Sleeve: ${esc(item.sleeve_condition)}${item.lowest_price ? ' | Lowest price: $' + esc(item.lowest_price) : ''} | Added: ${esc(item.added_at)}</small>
                            ${item.notes ? `<p><em>${esc(item.notes)}</em></p>` : ''}
                            <div>
                                <button onclick="window.location.href='album.html?id=${encodeURIComponent(item.discogs_release_id)}'">View Tracklist</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p>Your collection is empty. Search for albums and click <strong>Add to Collection</strong>!</p>';
                }
            })
            .catch(() => {
                document.getElementById('loading').innerText = 'Failed to load collection.';
            });
    </script>
</body>
</html>
